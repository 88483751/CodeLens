# This file is included in the Nginx http context.
limit_req_zone $binary_remote_addr zone=codelens_login:10m rate=5r/m;

server {
    listen 80;
    server_name __CODELENS_HOST__;
    return 301 https://__CODELENS_HOST__$request_uri;
}

server {
    listen 443 ssl;
    server_name __CODELENS_HOST__;
    ssl_certificate /etc/nginx/codelens-tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/codelens-tls/codelens.key;
    ssl_protocols TLSv1.2;
    root /var/www/codelens/current;
    index index.html;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
    gzip on;
    gzip_types application/javascript application/json application/wasm text/css;

    location = /api { return 404; }
    location /api/ { return 404; }

    location = /api/sync/login {
        limit_req zone=codelens_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:18767;
    }

    location ^~ /api/sync/ {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:18767;
    }

    location /engine/ {
        types {
            application/javascript js mjs;
            application/wasm wasm;
            application/json json;
            application/zip zip;
            text/plain txt;
        }
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
