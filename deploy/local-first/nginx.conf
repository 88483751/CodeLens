# Place inside the http block of the ECS nginx.conf.
server {
    listen 8080;
    server_name _;
    root C:/codelens-site;

    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location = / { try_files /index.html =404; }
    location = /codelens-local.zip { try_files $uri =404; }
    location / { return 404; }
}
