# CodeLens 站点配置
# 由 deploy/bootstrap.sh 安装到 /etc/nginx/conf.d/codelens.conf
#
# 设计要点：
# 1. 静态文件直接由 Nginx 托管，不跑 Vite dev server（省内存、无 HMR 开销）
# 2. /api/ 反代到后端，并把 Host / Origin 改写为后端自身来源
#    —— 后端 _guard() 只接受 localhost/127.0.0.1 的 Host 与 Origin，
#       改写后无需修改任何业务代码即可通过校验
# 3. 关闭代理缓冲：/api/review、/api/ai 使用 StreamingResponse 分片推送，
#    开启缓冲会导致前端长时间无输出
# 4. client_max_body_size 必须 > 12MB（后端 MAX_BODY = 12*1024*1024）
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /opt/codelens/app/codelens-prototype/dist;
    index index.html;

    client_max_body_size 16m;
    client_body_timeout 180s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/codelens.access.log;
    error_log  /var/log/nginx/codelens.error.log warn;

    # 构建产物带内容哈希，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18766;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 关键：改写为后端认可的来源，绕过本机访问白名单
        proxy_set_header Host 127.0.0.1:18766;
        proxy_set_header Origin http://127.0.0.1:18766;

        # 关键：SSE / 分片流式响应不能缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 10s;

        # 保留客户端真实地址供日志排查
        proxy_set_header X-Real-IP $remote_addr;
    }
}
